<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ghost Seat | Smart App</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    <!-- Firebase Libraries -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

    <style>
        :root { --figma-green: #2ecc71; --figma-red: #ff4757; --figma-blue: #1e67fb; --ghost-blue: #9AD8F5; --light-blue: #e1f0ff; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: #111; display: flex; justify-content: center; align-items: center; min-height: 100vh; color: #000; }
        .phone-container { width: 375px; height: 750px; background: white; border-radius: 40px; position: relative; overflow: hidden; border: 8px solid #333; display: flex; flex-direction: column; }
        .notch { width: 150px; height: 25px; background: #333; margin: 0 auto; border-bottom-left-radius: 15px; border-bottom-right-radius: 15px; cursor: pointer; z-index: 9999; }
        .screen { flex: 1; display: none; flex-direction: column; align-items: center; padding: 20px; text-align: center; width: 100%; }
        .active { display: flex !important; }
        .radar { width: 100px; height: 100px; border: 4px solid var(--ghost-blue); border-radius: 50%; margin: 40px auto; animation: pulse 0.6s infinite; }
        @keyframes pulse { 0% { transform: scale(0.8); opacity: 0.5; } 100% { transform: scale(1.1); opacity: 1; } }
        .screen-header { padding: 15px 0; font-weight: 600; font-size: 16px; text-transform: uppercase; }
        h2 { font-weight: 800; font-size: 24px; margin: 20px 0; }
        .btn-sq { flex: 1; padding: 18px; border-radius: 15px; border: none; font-weight: bold; cursor: pointer; color: white; font-size: 16px; }
        .btn-long { width: 100%; padding: 18px; border-radius: 12px; border: none; background: var(--figma-blue); color: white; font-weight: bold; font-size: 16px; margin-top: auto; margin-bottom: 10px; cursor: pointer; }
        input { width: 100%; padding: 15px; border-radius: 10px; border: 1px solid #ccc; margin-bottom: 10px; font-size: 16px; }
        .timer-box { margin: 20px 0; background: #f8f9fa; padding: 25px; border-radius: 20px; width: 100%; border: 2px solid var(--figma-green); }
        .time-chip { padding: 8px 12px; background: #eee; border-radius: 20px; font-size: 12px; font-weight: bold; cursor: pointer; margin: 5px; }
    </style>
</head>
<body>

<div class="phone-container">
    <div class="notch" id="adminNotch"></div>

    <!-- SCREEN 0: SENSING -->
    <div id="screen0" class="screen active">
        <div class="screen-header">SENSING...</div>
        <div class="radar"></div>
        <h2 style="margin-top: 20px;">Ghost Sensor v1.0</h2>
        <p>Analyzing Seat <span id="currentSeatDisplay">#...</span></p>
    </div>

    <!-- SCREEN 1: STATUS -->
    <div id="screen1" class="screen">
        <div class="screen-header">STATUS SCREEN</div>
        <h2 id="statusTitle">...</h2>
        <div id="statusIcon" style="font-size: 80px; margin: 20px 0;">💺</div>
        <p id="statusMsg" style="font-weight: 500; font-size: 16px; margin-bottom: 30px;"></p>
        <div id="actionButtons" style="display:flex; gap:15px; width:100%;"></div>
    </div>

    <!-- SCREEN 2: FORM -->
    <div id="screen2" class="screen">
        <div class="screen-header">BOOKING FORM</div>
        <h2>Reserve Seat</h2>
        <div style="text-align: left; width: 100%;">
            <label><b>Name</b></label>
            <input type="text" id="nameInput" placeholder="Enter your name">
            <p style="margin: 10px 0;"><b>Duration:</b> <span id="durationDisp">15</span> mins</p>
            <div style="display:flex; flex-wrap:wrap; justify-content:center; margin-bottom: 20px;">
                <div class="time-chip" onclick="setMins(15)">15m</div>
                <div class="time-chip" onclick="setMins(30)">30m</div>
                <div class="time-chip" onclick="setMins(60)">1h</div>
                <div class="time-chip" onclick="addMins(15)" style="background:var(--ghost-blue);">+15m</div>
            </div>
        </div>
        <button class="btn-long" onclick="confirmBooking()">Reserve</button>
    </div>

    <!-- SCREEN 3: SUCCESS -->
    <div id="screen3" class="screen">
        <div class="screen-header">SUCCESS</div>
        <div style="font-size: 60px; color: var(--figma-green);">✔️</div>
        <h2>Seat <span id="successSeatDisplay"></span> Reserved!</h2>
        <div class="timer-box">
            <p>🕒 TIME REMAINING</p>
            <h1 id="timerClock" style="font-size: 42px;">00:15:00</h1>
        </div>
        <button class="btn-long" onclick="goHome()">Minimize App</button>
        <button class="btn-long" style="background:#555;" onclick="finishSession()">Finish the session</button>
    </div>

    <!-- SCREEN 4: REPORT -->
    <div id="screen4" class="screen">
        <div class="screen-header">REPORT</div>
        <div style="font-size: 80px; margin: 40px;">😊</div>
        <h2>Thanks for letting us know!</h2>
        <button class="btn-long" onclick="goHome()">Done</button>
    </div>
</div>

<script>
// 1. FIREBASE CONFIG
const firebaseConfig = {
  apiKey: "AIzaSyBo-83st_6iUSVt72cPyrG29ChnfNZr53k",
  authDomain: "ghostseat.firebaseapp.com",
  databaseURL: "https://ghostseat-default-rtdb.firebaseio.com",
  projectId: "ghostseat",
  storageBucket: "ghostseat.firebasestorage.app",
  messagingSenderId: "609525103633",
  appId: "1:609525103633:web:8f542a1fcb9a2582eb05b0",
  measurementId: "G-LVTK159XYG"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// 2. GLOBALS
const urlParams = new URLSearchParams(window.location.search);
const seatNum = urlParams.get('seat') || "01"; 
let totalSecs = 900; 
let countdownInterval = null;

window.onload = function() {
    document.getElementById('currentSeatDisplay').innerText = "#" + seatNum;
    document.getElementById('successSeatDisplay').innerText = "#" + seatNum;
    setTimeout(checkSeat, 1000); 
};

// 3. SENSING LOGIC
function checkSeat() {
    db.ref('seats/' + seatNum).once('value').then(snap => {
        const data = snap.val();
        const now = Date.now();
        const btnArea = document.getElementById('actionButtons');

        if (data && data.expiry > now) {
            document.getElementById('statusTitle').innerText = "Seat Taken!";
            document.getElementById('statusIcon').innerText = "❌";
            document.getElementById('statusMsg').innerText = "Reserved by " + data.userName;
            btnArea.innerHTML = `<button class="btn-sq" style="background:var(--figma-red);" onclick="nextScreen('screen4')">REPORT</button>
                                 <button class="btn-sq" style="background:#555;" onclick="goHome()">FIND NEW</button>`;
        } else {
            document.getElementById('statusTitle').innerText = "Seat Available!";
            document.getElementById('statusIcon').innerText = "✅";
            document.getElementById('statusMsg').innerText = "Wanna book Seat #" + seatNum + "?";
            btnArea.innerHTML = `<button class="btn-sq" style="background:var(--figma-green);" onclick="nextScreen('screen2')">YES</button>
                                 <button class="btn-sq" style="background:var(--figma-red);" onclick="goHome()">NO</button>`;
        }
        nextScreen('screen1');
    });
}

// 4. BOOKING LOGIC
function confirmBooking() {
    const name = document.getElementById('nameInput').value || "Guest";
    const expiry = Date.now() + (totalSecs * 1000);
    
    db.ref('seats/' + seatNum).set({
        userName: name,
        expiry: expiry
    }).then(() => {
        console.log("Data saved to Firebase");
        nextScreen('screen3');
        startTimer();
    });
}

function startTimer() {
    const clock = document.getElementById('timerClock');
    if(countdownInterval) clearInterval(countdownInterval);

    countdownInterval = setInterval(() => {
        if (totalSecs <= 0) { 
            clearInterval(countdownInterval); 
            db.ref('seats/' + seatNum).remove(); // Auto-clear when done
            return; 
        }
        totalSecs--;
        let m = Math.floor(totalSecs / 60);
        let s = totalSecs % 60;
        clock.innerText = `00:${m < 10 ? '0'+m : m}:${s < 10 ? '0'+s : s}`;
    }, 1000);
}

// 5. THE FINISH LOGIC (This is what you asked for)
function finishSession() {
    if (confirm("End your session now? This will release Seat #" + seatNum)) {
        console.log("Finishing session for seat: " + seatNum);
        
        // STOP CLOCK
        if(countdownInterval) clearInterval(countdownInterval);
        
        // WIPE FROM FIREBASE
        db.ref('seats/' + seatNum).remove().then(() => {
            console.log("Firebase data deleted successfully.");
            alert("Session ended. Seat is now available.");
            window.location.href = 'index.html';
        }).catch(err => {
            console.error("Firebase removal failed:", err);
            window.location.href = 'index.html';
        });
    }
}

// 6. UTILITIES
function nextScreen(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
}
function setMins(m) { totalSecs = m * 60; document.getElementById('durationDisp').innerText = m; }
function addMins(m) { totalSecs += (m * 60); document.getElementById('durationDisp').innerText = totalSecs/60; }
function goHome() { window.location.href = 'index.html'; }
</script>
</body>
</html>
