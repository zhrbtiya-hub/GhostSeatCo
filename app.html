<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ghost Seat | Smart App</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    
    <!-- Firebase Libraries -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

    <style>
        :root {
            --figma-green: #2ecc71; --figma-red: #ff4757; --figma-blue: #1e67fb;
            --ghost-blue: #9AD8F5; --light-blue: #e1f0ff;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: #111; display: flex; justify-content: center; align-items: center; min-height: 100vh; color: #000; }

        .phone-container {
            width: 375px; height: 750px; background: white; border-radius: 40px;
            position: relative; overflow: hidden; border: 8px solid #333;
            display: flex; flex-direction: column; box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        .notch { width: 150px; height: 25px; background: #333; margin: 0 auto; border-bottom-left-radius: 15px; border-bottom-right-radius: 15px; cursor: pointer; }

        /* THE FIX: These classes ensure screens show and hide correctly */
        .screen { flex: 1; display: none; flex-direction: column; align-items: center; padding: 20px; text-align: center; width: 100%; }
        .active { display: flex !important; }

        /* Fast Sensing Animation */
        .radar {
            width: 120px; height: 120px; border: 4px solid var(--ghost-blue);
            border-radius: 50%; margin: 40px auto; position: relative;
            animation: pulse 0.5s infinite; 
        }
        @keyframes pulse { 0% { transform: scale(0.8); opacity: 0.5; } 100% { transform: scale(1.1); opacity: 0; } }

        .screen-header { padding: 15px 0; font-weight: 600; font-size: 16px; color: #000; text-transform: uppercase; }
        h2 { font-weight: 800; font-size: 24px; margin: 20px 0; }
        .btn-group { display: flex; gap: 15px; width: 100%; margin-top: auto; padding-bottom: 30px; }
        .btn-sq { flex: 1; padding: 18px; border-radius: 15px; border: none; font-weight: bold; cursor: pointer; color: white; font-size: 16px; }
        .btn-long { width: 100%; padding: 18px; border-radius: 12px; border: none; background: var(--figma-blue); color: white; font-weight: bold; font-size: 16px; margin-top: auto; margin-bottom: 30px; cursor: pointer; }
        input { width: 100%; padding: 15px; border-radius: 10px; border: 1px solid #ccc; margin: 10px 0; font-size: 16px; }
        .timer-box { margin: 20px 0; background: #f8f9fa; padding: 25px; border-radius: 20px; width: 100%; border: 2px solid var(--figma-green); }
    </style>
</head>
<body>

<div class="phone-container">
    <div class="notch" onclick="nextScreen('screen5')"></div>

    <!-- SCREEN 0: SENSING -->
    <div id="screen0" class="screen active">
        <div class="screen-header">SENSING...</div>
        <div class="radar"></div>
        <h2 style="margin-top: 20px;">Ghost Sensor v1.0</h2>
        <p>Analyzing Seat <span id="currentSeatID" style="font-weight:bold;">...</span></p>
    </div>

    <!-- SCREEN 1: STATUS -->
    <div id="screen1" class="screen">
        <div class="screen-header">STATUS SCREEN</div>
        <h2 id="statusTitle">...</h2>
        <div id="statusIcon" style="font-size: 100px; margin: 30px 0;">💺</div>
        <p id="statusMsg" style="font-weight: 500; font-size: 18px; color: #444; padding: 0 10px;"></p>
        <div id="actionButtons" style="display:flex; gap:15px; width:100%;"></div>
    </div>

    <!-- SCREEN 2: BOOKING FORM -->
    <div id="screen2" class="screen">
        <div class="screen-header">BOOKING FORM</div>
        <h2>Reserve Seat</h2>
        <div style="text-align: left; width: 100%;">
            <label><b>Name</b></label>
            <input type="text" id="nameInput" placeholder="Enter name">
            <p style="margin-top: 20px;"><b>Duration:</b> 15 Minutes</p>
        </div>
        <button class="btn-long" onclick="confirmBooking()">Confirm Reservation</button>
    </div>

    <!-- SCREEN 3: SUCCESS -->
    <div id="screen3" class="screen">
        <div class="screen-header">SUCCESS</div>
        <div style="font-size: 60px; color: var(--figma-green);">✔️</div>
        <h2>Seat <span id="successSeatID"></span> Reserved!</h2>
        <div class="timer-box">
            <p>🕒 TIME REMAINING</p>
            <h1 id="timerClock" style="font-size: 42px;">00:15:00</h1>
        </div>
        <button class="btn-long" onclick="goHome()">Finish</button>
    </div>

    <!-- SCREEN 4: REPORT -->
    <div id="screen4" class="screen">
        <div class="screen-header">REPORT</div>
        <div style="font-size: 80px; margin: 40px;">😊</div>
        <h2>Thanks for letting us know!</h2>
        <button class="btn-long" onclick="goHome()">Done</button>
    </div>

    <!-- SCREEN 5: ADMIN -->
    <div id="screen5" class="screen">
        <div class="screen-header">ADMIN</div>
        <div id="historyList" style="width:100%; text-align:left;"></div>
        <button class="btn-long" onclick="nextScreen('screen0')">Restart</button>
    </div>
</div>

<script>
// !!! PASTE YOUR FIREBASE CONFIG BOX BELOW !!!
const firebaseConfig = {
  apiKey: "AIzaSyBo-83st_6iUSVt72cPyrG29ChnfNZr53k",
  authDomain: "ghostseat.firebaseapp.com",
  databaseURL: "https://ghostseat-default-rtdb.firebaseio.com",
  projectId: "ghostseat",
  storageBucket: "ghostseat.firebasestorage.app",
  messagingSenderId: "609525103633",
  appId: "1:609525103633:web:8f542a1fcb9a2582eb05b0",
  measurementId: "G-LVTK159XYG"
};

// Initialize Firebase with a safety check
try {
    firebase.initializeApp(firebaseConfig);
    var database = firebase.database();
} catch (e) {
    console.error("Firebase failed to load. Check your config!", e);
}

// 1. Get Seat Number immediately
const urlParams = new URLSearchParams(window.location.search);
const seatNumber = urlParams.get('seat') || "01"; 
let totalSeconds = 900; 

// 2. Start Logic
window.onload = function() {
    // Update labels before sensing finishes
    document.getElementById('currentSeatID').innerText = "#" + seatNumber;
    document.getElementById('successSeatID').innerText = "#" + seatNumber;
    
    // Sense for only 0.8 seconds
    setTimeout(checkSeat, 800); 
};

function checkSeat() {
    if (!database) {
        alert("Database not connected. Check Firebase Config.");
        return;
    }

    database.ref('seats/' + seatNumber).once('value').then((snapshot) => {
        const data = snapshot.val();
        const now = Date.now();
        const btnGroup = document.getElementById('actionButtons');

        if (data && data.expiry > now) {
            // OCCUPIED
            document.getElementById('statusTitle').innerText = "Seat Taken!";
            document.getElementById('statusIcon').innerText = "❌";
            document.getElementById('statusMsg').innerText = "Currently reserved by " + data.userName;
            btnGroup.innerHTML = `
                <button class="btn-sq" style="background:#ff4757;" onclick="nextScreen('screen4')">REPORT</button>
                <button class="btn-sq" style="background:#555;" onclick="goHome()">FIND NEW</button>
            `;
        } else {
            // AVAILABLE
            document.getElementById('statusTitle').innerText = "Seat Available!";
            document.getElementById('statusIcon').innerText = "✅";
            document.getElementById('statusMsg').innerText = "Wanna book Seat #" + seatNumber + "?";
            btnGroup.innerHTML = `
                <button class="btn-sq" style="background:#2ecc71;" onclick="nextScreen('screen2')">YES</button>
                <button class="btn-sq" style="background:#ff4757;" onclick="goHome()">NO</button>
            `;
        }
        nextScreen('screen1');
    }).catch(err => {
        console.error("Firebase error:", err);
        alert("Error connecting to database. Make sure Firebase Rules are set to public.");
    });
}

function confirmBooking() {
    const name = document.getElementById('nameInput').value || "Student";
    const expiry = Date.now() + (totalSeconds * 1000);

    database.ref('seats/' + seatNumber).set({ userName: name, expiry: expiry });
    
    // Log history
    database.ref('history').push({ name: name, seat: seatNumber, time: new Date().toLocaleTimeString() });

    nextScreen('screen3');
    startTimer();
}

function startTimer() {
    const clock = document.getElementById('timerClock');
    const interval = setInterval(() => {
        if (totalSeconds <= 0) { clearInterval(interval); return; }
        totalSeconds--;
        let m = Math.floor(totalSeconds / 60);
        let s = totalSeconds % 60;
        clock.innerText = `00:${m < 10 ? '0'+m : m}:${s < 10 ? '0'+s : s}`;
    }, 1000);
}

function nextScreen(id) {
    // Hide all screens
    const screens = document.querySelectorAll('.screen');
    screens.forEach(s => s.classList.remove('active'));
    
    // Show target
    const target = document.getElementById(id);
    if (target) {
        target.classList.add('active');
    }
}

function goHome() { window.location.href = 'index.html'; }
</script>

</body>
</html>
