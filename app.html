<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ghost Seat | Smart App</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <style>
        :root { --figma-green: #2ecc71; --figma-red: #ff4757; --figma-blue: #1e67fb; --ghost-blue: #9AD8F5; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: #111; display: flex; justify-content: center; align-items: center; min-height: 100vh; color: #000; }
        .phone-container { width: 375px; height: 750px; background: white; border-radius: 40px; position: relative; overflow: hidden; border: 8px solid #333; display: flex; flex-direction: column; }
        .notch { width: 150px; height: 25px; background: #333; margin: 0 auto; border-bottom-left-radius: 15px; border-bottom-right-radius: 15px; cursor: pointer; z-index: 9999; }
        .screen { flex: 1; display: none; flex-direction: column; align-items: center; padding: 20px; text-align: center; width: 100%; }
        .active { display: flex !important; }
        .radar { width: 100px; height: 100px; border: 4px solid var(--ghost-blue); border-radius: 50%; margin: 40px auto; animation: pulse 0.6s infinite; }
        @keyframes pulse { 0% { transform: scale(0.8); opacity: 0.5; } 100% { transform: scale(1.1); opacity: 0; } }
        .btn-sq { flex: 1; padding: 18px; border-radius: 15px; border: none; font-weight: bold; cursor: pointer; color: white; }
        .btn-long { width: 100%; padding: 18px; border-radius: 12px; border: none; background: var(--figma-blue); color: white; font-weight: bold; cursor: pointer; margin-top: auto; margin-bottom: 10px; }
        input { width: 100%; padding: 15px; border-radius: 10px; border: 1px solid #ccc; margin-bottom: 10px; font-size: 16px; }
        .timer-box { margin: 20px 0; background: #f8f9fa; padding: 25px; border-radius: 20px; width: 100%; border: 2px solid var(--figma-green); }
        .time-chip { padding: 8px 12px; background: #eee; border-radius: 20px; font-size: 12px; font-weight: bold; cursor: pointer; margin: 5px; }
    </style>
</head>
<body>

<div class="phone-container">
    <div class="notch" id="adminNotch"></div>

    <div id="screen0" class="screen active">
        <div class="screen-header" style="margin-top:10px; font-size:12px; color:#888;">GHOST SENSOR v2.0</div>
        <div class="radar"></div>
        <h2>Analyzing Seat...</h2>
        <p>Checking Seat <span id="seatDisp0">#...</span></p>
    </div>

    <div id="screen1" class="screen">
        <h2 id="statusTitle">...</h2>
        <div id="statusIcon" style="font-size: 80px; margin: 20px 0;">💺</div>
        <p id="statusMsg" style="margin-bottom: 20px; padding: 0 10px;"></p>
        <div id="actionButtons" style="display:flex; gap:15px; width:100%;"></div>
    </div>

    <div id="screen2" class="screen">
        <h2>Reserve Seat</h2>
        <input type="text" id="nameInput" placeholder="Your Name">
        <p>Duration: <span id="durText">15</span> mins</p>
        <div style="display:flex; flex-wrap:wrap; justify-content:center; margin-bottom:10px;">
            <div class="time-chip" onclick="setMins(15)">15m</div>
            <div class="time-chip" onclick="setMins(30)">30m</div>
            <div class="time-chip" onclick="setMins(60)">1h</div>
            <div class="time-chip" onclick="addMins(15)" style="background:var(--ghost-blue);">+15m</div>
        </div>
        <button class="btn-long" onclick="confirmBooking()">Start Session</button>
    </div>

    <div id="screen3" class="screen">
        <div style="font-size: 50px; color: var(--figma-green); margin-top:20px;">✔️</div>
        <h2>Seat <span id="seatDisp3"></span> Reserved!</h2>
        <div class="timer-box">
            <p style="font-size:12px; font-weight:bold; color:#888;">TIME REMAINING</p>
            <h1 id="timerClock" style="font-size: 40px;">00:15:00</h1>
        </div>
        <button class="btn-long" onclick="goHome()">Minimize App</button>
        <button id="finishBtn" class="btn-long" style="background:#444;" onclick="finishSession()">Finish the session</button>
    </div>
</div>

<script>
// REPLACE WITH YOUR FIREBASE CONFIG
const firebaseConfig = {
  apiKey: "AIzaSyBo-83st_6iUSVt72cPyrG29ChnfNZr53k",
  authDomain: "ghostseat.firebaseapp.com",
  databaseURL: "https://ghostseat-default-rtdb.firebaseio.com",
  projectId: "ghostseat",
  storageBucket: "ghostseat.firebasestorage.app",
  messagingSenderId: "609525103633",
  appId: "1:609525103633:web:8f542a1fcb9a2582eb05b0",
  measurementId: "G-LVTK159XYG"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

const urlParams = new URLSearchParams(window.location.search);
const seatNum = urlParams.get('seat') || "01";
let totalSecs = 900;
let countdownInterval = null;

window.onload = function() {
    document.getElementById('seatDisp0').innerText = "#" + seatNum;
    document.getElementById('seatDisp3').innerText = "#" + seatNum;

    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js');
        Notification.requestPermission();
    }
    
    setTimeout(checkSeat, 1000);
};

function checkSeat() {
    db.ref('seats/' + seatNum).once('value').then(snap => {
        const data = snap.val();
        const now = Date.now();
        const btnArea = document.getElementById('actionButtons');

        if (data && data.expiry > now) {
            document.getElementById('statusTitle').innerText = "Seat Taken!";
            document.getElementById('statusIcon').innerText = "❌";
            document.getElementById('statusMsg').innerText = "Currently reserved by " + data.userName;
            btnArea.innerHTML = `<button onclick="goHome()" style="background:#555; flex:1; padding:15px; border-radius:10px; border:none; color:white; font-weight:bold; cursor:pointer;">FIND NEW</button>`;
        } else {
            document.getElementById('statusTitle').innerText = "Seat Available!";
            document.getElementById('statusIcon').innerText = "✅";
            document.getElementById('statusMsg').innerText = "Wanna book Seat #" + seatNum + "?";
            btnArea.innerHTML = `<button onclick="nextScreen('screen2')" style="background:var(--figma-green); flex:1; padding:15px; border-radius:10px; border:none; color:white; font-weight:bold; cursor:pointer;">YES</button>
                                 <button onclick="goHome()" style="background:var(--figma-red); flex:1; padding:15px; border-radius:10px; border:none; color:white; font-weight:bold; cursor:pointer;">NO</button>`;
        }
        nextScreen('screen1');
    });
}

function confirmBooking() {
    const name = document.getElementById('nameInput').value || "Student";
    const expiry = Date.now() + (totalSecs * 1000);
    
    db.ref('seats/' + seatNum).set({ userName: name, expiry: expiry }).then(() => {
        if (navigator.serviceWorker.controller) {
            navigator.serviceWorker.controller.postMessage({
                type: 'SCHEDULE_NOTIFICATION',
                delay: totalSecs * 1000,
                seat: seatNum
            });
        }
        nextScreen('screen3');
        startTimer();
    });
}

function startTimer() {
    const clock = document.getElementById('timerClock');
    if(countdownInterval) clearInterval(countdownInterval);
    countdownInterval = setInterval(() => {
        if (totalSecs <= 0) {
            clearInterval(countdownInterval);
            db.ref('seats/' + seatNum).remove();
            return;
        }
        totalSecs--;
        let h = Math.floor(totalSecs / 3600);
        let m = Math.floor((totalSecs % 3600) / 60);
        let s = totalSecs % 60;
        clock.innerText = `${h < 10 ? '0'+h : h}:${m < 10 ? '0'+m : m}:${s < 10 ? '0'+s : s}`;
    }, 1000);
}

function finishSession() {
    const fBtn = document.getElementById('finishBtn');
    if (confirm("End session and release seat?")) {
        fBtn.innerText = "Releasing...";
        fBtn.disabled = true;

        // 1. Clear Local Timer
        clearInterval(countdownInterval);

        // 2. Cancel Notification
        if (navigator.serviceWorker.controller) {
            navigator.serviceWorker.controller.postMessage({ type: 'CANCEL_NOTIFICATION' });
        }

        // 3. REMOVE FROM DATABASE
        db.ref('seats/' + seatNum).remove()
            .then(() => {
                console.log("Database cleared.");
                window.location.href = 'index.html';
            })
            .catch(err => {
                console.error(err);
                window.location.href = 'index.html';
            });
    }
}

function nextScreen(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
}
function setMins(m) { totalSecs = m * 60; document.getElementById('durText').innerText = m; }
function addMins(m) { totalSecs += (m * 60); document.getElementById('durText').innerText = totalSecs/60; }
function goHome() { window.location.href = 'index.html'; }
</script>
</body>
</html>
