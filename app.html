<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ghost Seat App</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    
    <!-- Firebase Libraries -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

    <style>
        :root { --figma-green: #2ecc71; --figma-red: #ff4757; --figma-blue: #1e67fb; --ghost-blue: #9AD8F5; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: #111; display: flex; justify-content: center; align-items: center; min-height: 100vh; color: #000; }
        .phone-container { width: 375px; height: 700px; background: white; border-radius: 40px; position: relative; overflow: hidden; border: 8px solid #333; display: flex; flex-direction: column; }
        .notch { width: 150px; height: 25px; background: #333; margin: 0 auto; border-bottom-left-radius: 15px; border-bottom-right-radius: 15px; z-index: 9999; }
        .screen { flex: 1; display: none; flex-direction: column; align-items: center; padding: 20px; text-align: center; width: 100%; }
        .active { display: flex !important; }
        .radar { width: 80px; height: 80px; border: 4px solid var(--ghost-blue); border-radius: 50%; margin: 40px auto; animation: pulse 0.6s infinite; }
        @keyframes pulse { 0% { transform: scale(0.8); opacity: 0.5; } 100% { transform: scale(1.1); opacity: 0; } }
        h2 { font-weight: 800; font-size: 24px; margin: 20px 0; }
        .btn-sq { flex: 1; padding: 18px; border-radius: 15px; border: none; font-weight: bold; cursor: pointer; color: white; }
        .btn-long { width: 100%; padding: 18px; border-radius: 12px; border: none; background: var(--figma-blue); color: white; font-weight: bold; font-size: 16px; margin-top: auto; margin-bottom: 10px; cursor: pointer; }
        input { width: 100%; padding: 15px; border-radius: 10px; border: 1px solid #ccc; margin-bottom: 10px; }
        .timer-box { margin: 20px 0; background: #f8f9fa; padding: 25px; border-radius: 20px; width: 100%; border: 2px solid var(--figma-green); }
        .time-chip { padding: 8px 12px; background: #eee; border-radius: 20px; font-size: 12px; font-weight: bold; cursor: pointer; margin: 5px; }
    </style>
</head>
<body>

<div class="phone-container">
    <div class="notch"></div>

    <!-- SENSING -->
    <div id="screen0" class="screen active">
        <div class="radar"></div>
        <h2>Analyzing Seat...</h2>
        <p>Checking <span id="disp0">#...</span></p>
    </div>

    <!-- STATUS -->
    <div id="screen1" class="screen">
        <h2 id="statusTitle">...</h2>
        <div style="font-size: 60px; margin: 20px 0;" id="statusIcon">💺</div>
        <p id="statusMsg" style="margin-bottom: 30px;"></p>
        <div id="actionButtons" style="display:flex; gap:10px; width:100%;"></div>
    </div>

    <!-- FORM -->
    <div id="screen2" class="screen">
        <h2>Reserve Seat</h2>
        <input type="text" id="nameInput" placeholder="Enter your name">
        <p>Duration: <span id="durDisp">15</span> mins</p>
        <div style="display:flex; flex-wrap:wrap; justify-content:center; margin: 10px 0;">
            <div class="time-chip" onclick="setT(15)">15m</div>
            <div class="time-chip" onclick="setT(30)">30m</div>
            <div class="time-chip" onclick="addT(15)">+15m</div>
        </div>
        <button class="btn-long" onclick="bookNow()">Confirm</button>
    </div>

    <!-- SUCCESS -->
    <div id="screen3" class="screen">
        <div style="font-size: 50px; color: var(--figma-green);">✔️</div>
        <div class="timer-box">
            <h1 id="timerClock" style="font-size: 40px;">00:15:00</h1>
        </div>
        <button class="btn-long" onclick="location.href='index.html'">Minimize</button>
        <!-- CRITICAL BUTTON -->
        <button class="btn-long" style="background:#444;" onclick="forceFinish()">Finish session</button>
    </div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyBo-83st_6iUSVt72cPyrG29ChnfNZr53k",
  authDomain: "ghostseat.firebaseapp.com",
  databaseURL: "https://ghostseat-default-rtdb.firebaseio.com",
  projectId: "ghostseat",
  storageBucket: "ghostseat.firebasestorage.app",
  messagingSenderId: "609525103633",
  appId: "1:609525103633:web:8f542a1fcb9a2582eb05b0",
  measurementId: "G-LVTK159XYG"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

const params = new URLSearchParams(window.location.search);
const seatID = params.get('seat') || "01";
let secs = 900; // Total seconds for the countdown
let timer = null;
let targetExpiry = 0;

window.onload = () => {
    document.getElementById('disp0').innerText = "#" + seatID;
    setTimeout(check, 800);
};

function check() {
    db.ref('seats/' + seatID).once('value').then(s => {
        const d = s.val();
        const now = Date.now();
        const area = document.getElementById('actionButtons');
        
        if (d && d.expiry > now) {
            targetExpiry = d.expiry;
            
            // Format the duration string (e.g., "15 minutes" or "1 hour")
            let durText = d.chosenDuration >= 60 ? Math.floor(d.chosenDuration/60) + " hour(s)" : d.chosenDuration + " minutes";
            
            // Format the end time (e.g., 2:30 PM)
            let endTime = new Date(d.expiry).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

            document.getElementById('statusTitle').innerText = "Seat Taken!";
            document.getElementById('statusIcon').innerText = "❌";
            
            // NEW: Added Duration and End Time to the message
            document.getElementById('statusMsg').innerHTML = 
                `Reserved by <b>${d.user}</b><br>` + 
                `Duration: ${durText}<br>` +
                `Available at: <b>${endTime}</b>`;
            
            area.innerHTML = `<button onclick="resumeTimer()" style="background:var(--figma-blue); width:100%; border:none; color:white; padding:15px; border-radius:10px; font-weight:bold; cursor:pointer;">VIEW MY TIMER</button>`;
        } else {
            document.getElementById('statusTitle').innerText = "Seat Available!";
            document.getElementById('statusIcon').innerText = "✅";
            document.getElementById('statusMsg').innerText = "Wanna book Seat #" + seatID + "?";
            area.innerHTML = `<button onclick="show('screen2')" style="background:var(--figma-green); flex:1; border:none; color:white; padding:15px; border-radius:10px; font-weight:bold; cursor:pointer;">YES</button>
                             <button onclick="location.href='index.html'" style="background:var(--figma-red); flex:1; border:none; color:white; padding:15px; border-radius:10px; font-weight:bold; cursor:pointer; margin-left:10px;">NO</button>`;
        }
        show('screen1');
    });
}

function bookNow() {
    const n = document.getElementById('nameInput').value || "Student";
    const chosenDurationMinutes = secs / 60; // Calculate duration in minutes
    targetExpiry = Date.now() + (secs * 1000); 
    
    // Save User, Expiry, AND the Chosen Duration to the Cloud
    db.ref('seats/' + seatID).set({ 
        user: n, 
        expiry: targetExpiry,
        chosenDuration: chosenDurationMinutes 
    }).then(() => {
        show('screen3');
        start();
    });
}

function start() {
    if(timer) clearInterval(timer);
    timer = setInterval(() => {
        const now = Date.now();
        secs = Math.floor((targetExpiry - now) / 1000);

        if (secs <= 0) { 
            clearInterval(timer); 
            db.ref('seats/' + seatID).set(null); 
            document.getElementById('timerClock').innerText = "00:00:00";
            alert("Time is up!");
            location.href='index.html';
            return; 
        }

        let h = Math.floor(secs / 3600);
        let m = Math.floor((secs % 3600) / 60);
        let s = secs % 60;
        document.getElementById('timerClock').innerText = 
            (h < 10 ? "0"+h : h) + ":" + (m < 10 ? "0"+m : m) + ":" + (s < 10 ? "0"+s : s);
    }, 1000);
}

function forceFinish() {
    if(confirm("End session and release seat?")) {
        clearInterval(timer);
        db.ref('seats/' + seatID).set(null).then(() => {
            alert("Seat Released!");
            window.location.replace('index.html');
        });
    }
}

function show(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
}

function setT(m) { 
    secs = m * 60; 
    document.getElementById('durDisp').innerText = m; 
}

function addT(m) { 
    secs += (m * 60); 
    document.getElementById('durDisp').innerText = secs / 60; 
}
</script>
