<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ghost Seat Real-Time App</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    
    <!-- 1. Firebase "Brain" Libraries -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

    <style>
        :root {
            --figma-green: #2ecc71; --figma-red: #ff4757; --figma-blue: #1e67fb;
            --ghost-blue: #9AD8F5; --light-blue: #e1f0ff;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: #111; display: flex; justify-content: center; align-items: center; min-height: 100vh; color: #000; }
        .phone-container { width: 375px; height: 750px; background: white; border-radius: 40px; position: relative; overflow: hidden; border: 8px solid #333; display: flex; flex-direction: column; }
        .notch { width: 150px; height: 25px; background: #333; margin: 0 auto; border-bottom-left-radius: 15px; border-bottom-right-radius: 15px; cursor: pointer; }
        .screen { flex: 1; display: none; flex-direction: column; align-items: center; padding: 20px; text-align: center; }
        .active { display: flex !important; animation: fadeIn 0.4s ease-in; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .radar { width: 120px; height: 120px; border: 4px solid var(--ghost-blue); border-radius: 50%; margin: 40px auto; animation: pulse 0.4s infinite; }
        @keyframes pulse { 0% { transform: scale(0.8); opacity: 0.5; } 100% { transform: scale(1.1); opacity: 0; } }
        .btn-sq { flex: 1; padding: 18px; border-radius: 15px; border: none; font-weight: bold; cursor: pointer; color: white; font-size: 16px; }
        .btn-long { width: 100%; padding: 18px; border-radius: 12px; border: none; background: var(--figma-blue); color: white; font-weight: bold; cursor: pointer; margin-top: auto; margin-bottom: 30px; }
        input { width: 100%; padding: 15px; border-radius: 10px; border: 1px solid #ccc; margin: 10px 0; font-size: 16px; }
        .timer-box { margin: 20px 0; background: #f8f9fa; padding: 25px; border-radius: 20px; width: 100%; border: 2px solid var(--figma-green); }
    </style>
</head>
<body>

<div class="phone-container">
    <div class="notch" onclick="nextScreen('screen5')"></div>

    <!-- SCREEN 0: SENSING -->
    <div id="screen0" class="screen active">
        <h2 style="margin-top: 40px;">Ghost Sensor v1.0</h2>
        <div class="radar"></div>
        <p>Analyzing Seat <span id="currentSeatID">...</span></p>
    </div>

    <!-- SCREEN 1: STATUS -->
    <div id="screen1" class="screen">
        <h2 id="statusTitle">...</h2>
        <div id="statusIcon" style="font-size: 80px; margin: 20px 0;">💺</div>
        <p id="statusMsg" style="font-weight: 500; margin-bottom: 30px; padding: 0 10px;"></p>
        <div id="actionButtons" style="display:flex; gap:15px; width:100%;"></div>
    </div>

    <!-- SCREEN 2: FORM -->
    <div id="screen2" class="screen">
        <h2>Reserve Seat</h2>
        <div style="text-align: left; width: 100%;">
            <label><b>Your Name</b></label>
            <input type="text" id="nameInput" placeholder="Type your name">
            <p style="margin-top: 10px;"><b>Duration:</b> 15 Minutes</p>
        </div>
        <button class="btn-long" onclick="confirmBooking()">Confirm Reservation</button>
    </div>

    <!-- SCREEN 3: SUCCESS -->
    <div id="screen3" class="screen">
        <div style="font-size: 60px; color: var(--figma-green);">✔️</div>
        <h2>Seat Reserved!</h2>
        <div class="timer-box">
            <p>🕒 TIME REMAINING</p>
            <h1 id="timerClock">00:15:00</h1>
        </div>
        <button class="btn-long" onclick="goHome()">Done</button>
    </div>

    <!-- SCREEN 4: REPORT -->
    <div id="screen4" class="screen">
        <h2>Report Sent!</h2>
        <div style="font-size:80px; margin:40px;">📩</div>
        <p>Supervisor has been notified.</p>
        <button class="btn-long" onclick="goHome()">Done</button>
    </div>

    <!-- SCREEN 5: ADMIN HISTORY -->
    <div id="screen5" class="screen">
        <h2>Admin Log</h2>
        <div id="adminList" style="width:100%; text-align:left; margin-top:20px;"></div>
        <button class="btn-long" onclick="nextScreen('screen0')">Restart</button>
    </div>
</div>

<script>
// 1. GLOBAL VARIABLES
let totalSeconds = 900; 
let countdownInterval;

// 2. DYNAMIC SEAT LOGIC
const urlParams = new URLSearchParams(window.location.search);
const seatNumber = urlParams.get('seat') || "01"; 

// 3. STARTUP LOGIC
window.onload = function() {
    // Update seat labels immediately
    document.getElementById('currentSeatID').innerText = "#" + seatNumber;
    document.getElementById('successSeatID').innerText = "#" + seatNumber;
    
    // --- SPEED FIX ---
    // Change this to 400 for near-instant sensing
    console.log("Sensing started...");
    setTimeout(checkSeatRealtime, 400); 
};

// 4. FIREBASE CHECK
function checkSeatRealtime() {
    database.ref('seats/' + seatNumber).once('value', (snapshot) => {
        const data = snapshot.val();
        const now = Date.now();
        const btnGroup = document.getElementById('actionButtons');

        if (data && data.expiry > now) {
            // OCCUPIED
            document.getElementById('statusTitle').innerText = "Seat Taken!";
            document.getElementById('statusIcon').innerText = "❌";
            document.getElementById('statusMsg').innerText = "Reserved by: " + data.userName;
            btnGroup.innerHTML = `
                <button class="btn-sq" style="background:#ff4757; color:white; border:none; padding:15px; border-radius:10px; flex:1; cursor:pointer; font-weight:bold;" onclick="nextScreen('screen4')">REPORT</button>
                <button class="btn-sq" style="background:#555; color:white; border:none; padding:15px; border-radius:10px; flex:1; cursor:pointer; font-weight:bold;" onclick="goHome()">FIND NEW</button>
            `;
        } else {
            // AVAILABLE
            document.getElementById('statusTitle').innerText = "Seat Available!";
            document.getElementById('statusIcon').innerText = "✅";
            document.getElementById('statusMsg').innerText = "Wanna book Seat #" + seatNumber + "?";
            btnGroup.innerHTML = `
                <button class="btn-sq" style="background:#2ecc71; color:white; border:none; padding:15px; border-radius:10px; flex:1; cursor:pointer; font-weight:bold;" onclick="nextScreen('screen2')">YES</button>
                <button class="btn-sq" style="background:#ff4757; color:white; border:none; padding:15px; border-radius:10px; flex:1; cursor:pointer; font-weight:bold;" onclick="goHome()">NO</button>
            `;
        }
        nextScreen('screen1');
    });
}

// 5. OTHER FUNCTIONS (Timer, Navigation)
function confirmBooking() {
    const name = document.getElementById('nameInput').value || "Student";
    const expiry = Date.now() + (totalSeconds * 1000);
    database.ref('seats/' + seatNumber).set({ userName: name, expiry: expiry });
    nextScreen('screen3');
    startCountdown();
}

function startCountdown() {
    clearInterval(countdownInterval);
    countdownInterval = setInterval(() => {
        if (totalSeconds <= 0) { clearInterval(countdownInterval); return; }
        totalSeconds--;
        let m = Math.floor(totalSeconds / 60);
        let s = totalSeconds % 60;
        document.getElementById('timerClock').innerText = `00:${m < 10 ? '0'+m : m}:${s < 10 ? '0'+s : s}`;
    }, 1000);
}

function nextScreen(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    const target = document.getElementById(id);
    if(target) target.classList.add('active');
}

function goHome() { window.location.href = 'index.html'; }
