<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ghost Seat | Smart App</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

    <style>
        :root { --figma-green: #2ecc71; --figma-red: #ff4757; --figma-blue: #1e67fb; --ghost-blue: #9AD8F5; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: #111; display: flex; justify-content: center; align-items: center; min-height: 100vh; color: #000; }
        .phone-container { width: 375px; height: 750px; background: white; border-radius: 40px; position: relative; overflow: hidden; border: 8px solid #333; display: flex; flex-direction: column; }
        .notch { width: 150px; height: 25px; background: #333; margin: 0 auto; border-bottom-left-radius: 15px; border-bottom-right-radius: 15px; cursor: pointer; z-index: 9999; }
        .screen { flex: 1; display: none; flex-direction: column; align-items: center; padding: 20px; text-align: center; width: 100%; }
        .active { display: flex !important; }
        .radar { width: 100px; height: 100px; border: 4px solid var(--ghost-blue); border-radius: 50%; margin: 40px auto; animation: pulse 0.6s infinite; }
        @keyframes pulse { 0% { transform: scale(0.8); opacity: 0.5; } 100% { transform: scale(1.1); opacity: 0; } }
        .btn-sq { flex: 1; padding: 18px; border-radius: 15px; border: none; font-weight: bold; cursor: pointer; color: white; }
        .btn-long { width: 100%; padding: 18px; border-radius: 12px; border: none; background: var(--figma-blue); color: white; font-weight: bold; cursor: pointer; margin-top: auto; margin-bottom: 10px; }
        input { width: 100%; padding: 15px; border-radius: 10px; border: 1px solid #ccc; margin-bottom: 10px; font-size: 16px; }
        .timer-box { margin: 20px 0; background: #f8f9fa; padding: 25px; border-radius: 20px; width: 100%; border: 2px solid var(--figma-green); }
        .time-chip { padding: 8px 12px; background: #eee; border-radius: 20px; font-size: 12px; font-weight: bold; cursor: pointer; margin: 5px; }
    </style>
</head>
<body>

<div class="phone-container">
    <div class="notch" id="secretAdminNotch"></div>

    <!-- SCREEN 0: SENSING -->
    <div id="screen0" class="screen active">
        <h2 style="margin-top: 40px;">Ghost Sensor v1.0</h2>
        <div class="radar"></div>
        <p>Analyzing Seat <span id="currentSeatDisplay">#...</span></p>
    </div>

    <!-- SCREEN 1: STATUS -->
    <div id="screen1" class="screen">
        <h2 id="statusTitle">...</h2>
        <div id="statusIcon" style="font-size: 80px; margin: 20px 0;">💺</div>
        <p id="statusMsg" style="margin-bottom: 30px; padding: 0 10px;"></p>
        <div id="actionButtons" style="display:flex; gap:15px; width:100%;"></div>
    </div>

    <!-- SCREEN 2: BOOKING FORM -->
    <div id="screen2" class="screen">
        <h2>Reserve Seat</h2>
        <div style="text-align: left; width: 100%;">
            <label><b>Name</b></label>
            <input type="text" id="nameInput" placeholder="Enter your name">
            <p><b>Duration:</b> <span id="durationDisp">15</span> mins</p>
            <div style="display:flex; flex-wrap:wrap; justify-content:center; margin: 10px 0;">
                <div class="time-chip" onclick="updateTime(15)">15m</div>
                <div class="time-chip" onclick="updateTime(30)">30m</div>
                <div class="time-chip" onclick="updateTime(60)">1h</div>
                <div class="time-chip" onclick="addTime(15)" style="background:var(--ghost-blue);">+15m</div>
            </div>
        </div>
        <button class="btn-long" onclick="confirmReservation()">Confirm</button>
    </div>

    <!-- SCREEN 3: SUCCESS & TIMER -->
    <div id="screen3" class="screen">
        <div style="font-size: 60px; color: var(--figma-green); margin-top:20px;">✔️</div>
        <h2>Seat <span id="successSeatDisplay"></span> Reserved!</h2>
        <div class="timer-box">
            <h1 id="timerClock" style="font-size: 42px;">00:15:00</h1>
        </div>
        <button class="btn-long" onclick="goHome()">Minimize App</button>
        <button class="btn-long" style="background:#444;" onclick="finishSession()">Finish the session</button>
    </div>
</div>

<script>
// !!! PASTE YOUR FIREBASE CONFIG HERE !!!
// Import the functions you need from the SDKs you need
import { initializeApp } from "firebase/app";
import { getAnalytics } from "firebase/analytics";
// TODO: Add SDKs for Firebase products that you want to use
// https://firebase.google.com/docs/web/setup#available-libraries

// Your web app's Firebase configuration
// For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyBo-83st_6iUSVt72cPyrG29ChnfNZr53k",
  authDomain: "ghostseat.firebaseapp.com",
  databaseURL: "https://ghostseat-default-rtdb.firebaseio.com",
  projectId: "ghostseat",
  storageBucket: "ghostseat.firebasestorage.app",
  messagingSenderId: "609525103633",
  appId: "1:609525103633:web:8f542a1fcb9a2582eb05b0",
  measurementId: "G-LVTK159XYG"
};

// Initialize Firebase
const app = initializeApp(firebaseConfig);
const analytics = getAnalytics(app);

// Global State
const urlParams = new URLSearchParams(window.location.search);
const seatNum = urlParams.get('seat') || "01"; 
let totalSeconds = 900; 
let timerInterval = null;

window.onload = function() {
    document.getElementById('currentSeatDisplay').innerText = "#" + seatNum;
    document.getElementById('successSeatDisplay').innerText = "#" + seatNum;
    setTimeout(checkSeatStatus, 1000);
};

// Logic: Check Cloud
function checkSeatStatus() {
    db.ref('seats/' + seatNum).once('value').then(snapshot => {
        const data = snapshot.val();
        const now = Date.now();
        const btnArea = document.getElementById('actionButtons');

        if (data && data.expiry > now) {
            document.getElementById('statusTitle').innerText = "Seat Taken!";
            document.getElementById('statusIcon').innerText = "❌";
            document.getElementById('statusMsg').innerText = "Reserved by " + data.userName;
            btnArea.innerHTML = `<button onclick="goHome()" class="btn-sq" style="background:#555;">FIND NEW</button>`;
        } else {
            document.getElementById('statusTitle').innerText = "Seat Available!";
            document.getElementById('statusIcon').innerText = "✅";
            document.getElementById('statusMsg').innerText = "Wanna book Seat #" + seatNum + "?";
            btnArea.innerHTML = `<button onclick="nextScreen('screen2')" class="btn-sq" style="background:var(--figma-green);">YES</button>
                                 <button onclick="goHome()" class="btn-sq" style="background:var(--figma-red);">NO</button>`;
        }
        nextScreen('screen1');
    });
}

// Logic: Save to Cloud
function confirmReservation() {
    const name = document.getElementById('nameInput').value || "Guest";
    const expiryTime = Date.now() + (totalSeconds * 1000);

    db.ref('seats/' + seatNum).set({
        userName: name,
        expiry: expiryTime
    }).then(() => {
        nextScreen('screen3');
        startClock();
    }).catch(err => alert("Error: " + err.message));
}

// Logic: Timer
function startClock() {
    if(timerInterval) clearInterval(timerInterval);
    timerInterval = setInterval(() => {
        if (totalSeconds <= 0) {
            clearInterval(timerInterval);
            db.ref('seats/' + seatNum).remove();
            alert("Time is up!");
            goHome();
            return;
        }
        totalSeconds--;
        let m = Math.floor(totalSeconds / 60);
        let s = totalSeconds % 60;
        document.getElementById('timerClock').innerText = `00:${m < 10 ? '0'+m : m}:${s < 10 ? '0'+s : s}`;
    }, 1000);
}

// Logic: THE FINISH BUTTON
function finishSession() {
    if (confirm("Release this seat and end session?")) {
        // 1. Stop the clock
        clearInterval(timerInterval);

        // 2. Tell Firebase to delete this seat
        db.ref('seats/' + seatNum).remove().then(() => {
            alert("Seat is now free!");
            window.location.href = 'index.html';
        }).catch(err => {
            alert("Failed to release seat: " + err.message);
        });
    }
}

// Helpers
function nextScreen(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
}
function updateTime(m) { totalSeconds = m * 60; document.getElementById('durationDisp').innerText = m; }
function addTime(m) { totalSeconds += (m * 60); document.getElementById('durationDisp').innerText = totalSeconds / 60; }
function goHome() { window.location.href = 'index.html'; }
</script>

</body>
</html>
